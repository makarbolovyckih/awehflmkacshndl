name: SchoolSchedule
options:
  bundleIdPrefix: com.schoolschedule
  deploymentTarget:
    iOS: "26.0"
settings:
  base:
    SWIFT_VERSION: "5.0"
    CODE_SIGN_STYLE: Automatic
targets:
  SchoolSchedule:
    type: application
    platform: iOS
    sources: [App, Shared]
    dependencies:
      - target: ScheduleWidget
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: Schedule
        NSSupportsLiveActivities: true
        NSSupportsLiveActivitiesFrequentUpdates: true
        UIBackgroundModes: [location]
        NSLocationWhenInUseUsageDescription: "Only used to keep the schedule's Live Activity updating during the school day. Your location is never read or stored."
        UILaunchScreen: {}
        UISupportedInterfaceOrientations: [UIInterfaceOrientationPortrait]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolschedule.app
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
  ScheduleWidget:
    type: app-extension
    platform: iOS
    sources: [Widget, Shared]
    info:
      path: Widget/Info.plist
      properties:
        CFBundleDisplayName: Schedule
        NSExtension:
          NSExtensionPointIdentifier: com.apple.widgetkit-extension
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.schoolschedule.app.widget
